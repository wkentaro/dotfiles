# Omarchy Quattro-style window management for macOS.
# Use Command where it is safe, and add Control where plain Command belongs to macOS.

config-version = 2
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
# Horizontal keeps the master pane on the left; nested containers then normalize
# to vertical, which is what makes the right-hand stack work.
default-root-container-orientation = 'horizontal'
persistent-workspaces = ['1', 'scratchpad']

# Match Quattro's behavior of centering the pointer after keyboard focus changes.
on-focus-changed = ['move-mouse window-lazy-center']

# Match Omarchy's spacing between tiled windows without adding outer margins.
gaps.inner.horizontal = 8
gaps.inner.vertical = 8

[mode.main.binding]
cmd-enter = 'exec-and-forget open -na WezTerm'
cmd-shift-b = 'exec-and-forget open -na "Brave Browser" --args --new-window'

# Window layout and state.
cmd-ctrl-j = 'layout tiles horizontal vertical'
cmd-ctrl-l = 'layout tiles accordion'
cmd-ctrl-t = 'layout floating tiling'
cmd-ctrl-f = 'fullscreen --no-outer-gaps'

# Master-and-stack shaping. join-with names where the existing neighbor is, not
# where the window should land, so a flat row only ever has left/right to join.
# The resulting container normalizes to vertical, which is the stacking.
# cmd-ctrl-v = 'join-with left'
# cmd-ctrl-shift-v = 'flatten-workspace-tree'
cmd-ctrl-b = 'balance-sizes'

# Ignore the non-TTY subprocess stdin when changing workspace at a horizontal edge.
cmd-left = 'exec-and-forget aerospace focus --boundaries-action fail left || aerospace workspace --no-stdin prev'
cmd-right = 'exec-and-forget aerospace focus --boundaries-action fail right || aerospace workspace --no-stdin next'
cmd-up = 'focus --boundaries all-monitors-outer-frame up'
cmd-down = 'focus --boundaries all-monitors-outer-frame down'

# Swap with a neighboring window, or cross the workspace boundary and follow it.
cmd-shift-left = 'swap left || move-node-to-workspace --focus-follows-window prev'
# A rightward crossing is appended at the far edge, so walk it back to the entry edge.
cmd-shift-right = 'exec-and-forget aerospace swap right || { aerospace move-node-to-workspace --focus-follows-window --no-stdin next && while aerospace move --boundaries-action fail left; do :; done; }'

# Directional window swaps within the current workspace.
cmd-shift-up = 'swap up'
cmd-shift-down = 'swap down'

# Numbered workspaces. The 0 key represents workspace 10, as in Quattro.
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
# cmd-0 = 'workspace 10'

# Move the focused window and follow it to the destination workspace.
cmd-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
cmd-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
cmd-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
cmd-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
cmd-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
cmd-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
cmd-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
cmd-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
cmd-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
cmd-shift-0 = 'move-node-to-workspace --focus-follows-window 10'

# Workspace history and sequential navigation.
# ctrl-alt-tab = 'workspace --wrap-around next'
# ctrl-alt-shift-tab = 'workspace --wrap-around prev'
cmd-ctrl-tab = 'workspace-back-and-forth'

# Focus the other monitor, including when its workspace has no windows.
cmd-ctrl-backtick = 'focus-monitor --wrap-around next'

# Scratchpad aliases used by Quattro.
cmd-ctrl-s = 'workspace --auto-back-and-forth scratchpad'

# Quattro-style coarse and fine resize steps.
cmd-ctrl-minus = 'resize width +100'
cmd-ctrl-equal = 'resize width -100'
cmd-ctrl-shift-minus = 'resize height -100'
cmd-ctrl-shift-equal = 'resize height +100'
