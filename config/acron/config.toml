agent = ["claude", "--model", "sonnet", "-p", "{prompt}", "--output-format", "stream-json", "--verbose", "--dangerously-skip-permissions"]
prompt = "/process-prs"
cwd = "~/ghq/github.com/wkentaro/git-hunk"
# Run when an open, non-draft PR has no recommend-* verdict yet.
condition = ['bash', '-c', 'test "$(gh pr list --state open --json isDraft,labels --jq "[.[] | select(.isDraft | not) | select([.labels[].name] | any(startswith(\"recommend-\")) | not)] | length")" -gt 0']

[[job]]
name = "git-hunk-kaizen-codebase"
schedule = "0 */4 * * *"
agent = ["claude", "--model", "opus", "-p", "{prompt}", "--output-format", "stream-json", "--verbose", "--dangerously-skip-permissions"]
prompt = "/kaizen-codebase"
cwd = "~/ghq/github.com/wkentaro/git-hunk"
timeout = "1h"
enabled = false
# No condition: self-directed, so it discovers its own work and an empty pass is
# a success. Daily cadence (one bounded improvement per day) keeps cost bounded;
# its output (a non-draft PR or a needs-triage issue) feeds the pipeline above.

