name: CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1

    - name: Test CLIProxyAPI quota command
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        make uv
        uv run --no-project --python 3.9 python -m unittest discover -s tests -p 'test_*.py'

    - name: Test Claude Code statusline
      run: bash claude/statusline-command.test.sh

    - name: Update submodules
      run: |
        git submodule update --init --recursive

    - name: Install this project
      run: |
        make install
