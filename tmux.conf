# vim: set ft=conf:

# ----------------------------------------------------------------------
# tmux plugin manager
# ----------------------------------------------------------------------
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-copycat'
# set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-open'

# set -g @catppuccin_flavour 'mocha'
# set -g @catppuccin_window_tabs_enabled on

# run '~/.tmux/plugins/tpm/tpm'

# ----------------------------------------------------------------------
# personal settings
# ----------------------------------------------------------------------

# Number tabs and panes the same way Herdr does.
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-option -g history-limit 30000
set-option -g set-titles on
set-option -g automatic-rename on
set-window-option -g automatic-rename on
set-option -g automatic-rename-format '#{=|-24|…;s|$HOME|~|:pane_current_path}:#{pane_current_command}'
set-window-option -g monitor-activity on
# set-option -g status-utf8 on
set-option -g status-interval 1

# escape time
set -sg escape-time 1

set-option -g allow-rename off

# disable annoying notification
setw -g monitor-activity off

# ----------------------------------------------------------------------
# Herdr-style chrome
# ----------------------------------------------------------------------

set-option -g default-terminal "xterm-256color"
set -ag terminal-overrides ",alacritty:RGB,xterm-256color:RGB,xterm-ghostty:RGB"

# Catppuccin Mocha tokens copied from Herdr's built-in theme.
set-option -g status-position top
set-option -g status-justify left
set-option -g status-style "none,fg=#6c7086,bg=#181825"
set-option -g status-left '#[bold,fg=#cdd6f4,bg=#181825] #S  '
set-option -g status-right ""
set-option -g status-left-length 64
set-option -g status-right-length 0
set-window-option -g window-status-separator ""
set-window-option -g window-status-style "dim,fg=#6c7086,bg=#313244"
set-window-option -g window-status-current-style "none,fg=#181825,bg=#89b4fa"
set-window-option -g window-status-format '#[dim,fg=#6c7086,bg=#313244] #{p7:window_index}#[none,fg=#7f849c,bg=#181825]#{?window_end_flag, + , }'
set-window-option -g window-status-current-format '#[none,fg=#181825,bg=#89b4fa] #{p7:window_index}#[none,fg=#7f849c,bg=#181825]#{?window_end_flag, + , }'
set-window-option -g window-status-bell-style "none,fg=#181825,bg=#f38ba8"

set-option -g pane-border-lines single
set-option -g pane-border-status off
set-option -g pane-border-style "fg=#6c7086"
set-option -g pane-active-border-style "fg=#89b4fa"

set-option -g message-style "none,fg=#181825,bg=#89b4fa"
set-option -g message-command-style "none,fg=#181825,bg=#89b4fa"
set-window-option -g mode-style "none,fg=#181825,bg=#89b4fa"
set-option -g display-panes-active-colour "#89b4fa"
set-option -g display-panes-colour "#6c7086"
set-window-option -g clock-mode-colour "#89b4fa"

# ----------------------------------------------------------------------
# Herdr key map
# ----------------------------------------------------------------------

unbind C-b
set-option -g prefix C-t

bind-key d detach-client
bind-key R source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Herdr workspaces map to tmux sessions.
bind-key N command-prompt -p "new workspace:" "new-session -s '%%' -c '#{pane_current_path}'"
bind-key W command-prompt -I '#S' -p "rename workspace:" "rename-session '%%'"
bind-key D confirm-before -p "close workspace #S? (y/n)" kill-session
bind-key w choose-tree -Zs
bind-key o choose-tree -Z
bind-key -n M-N command-prompt -p "new workspace:" "new-session -s '%%' -c '#{pane_current_path}'"
bind-key -n M-o choose-tree -Z
bind-key -n M-K switch-client -p
bind-key -n M-J switch-client -n

# Herdr tabs map to tmux windows.
bind-key c new-window -c "#{pane_current_path}"
bind-key T command-prompt -I '#W' -p "rename tab:" "rename-window '%%'"
bind-key p previous-window
bind-key n next-window
bind-key X confirm-before -p "close tab #W? (y/n)" kill-window
bind-key -n M-t new-window -c "#{pane_current_path}"
bind-key -n M-p previous-window
bind-key -n M-n next-window

# Panes use the same navigation, split, close, zoom, and rename keys.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key H swap-pane -s '{left-of}'
bind-key J swap-pane -s '{down-of}'
bind-key K swap-pane -s '{up-of}'
bind-key L swap-pane -s '{right-of}'
bind-key Tab select-pane -t '{next}'
bind-key BTab select-pane -t '{previous}'
bind-key v split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key x confirm-before -p "close pane? (y/n)" kill-pane
bind-key z resize-pane -Z
bind-key P command-prompt -I '#T' -p "rename pane:" "select-pane -T '%%'"
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n M-v split-window -h -c "#{pane_current_path}"
bind-key -n M-- split-window -v -c "#{pane_current_path}"
bind-key -n M-z resize-pane -Z

# Keep resize mode open until Escape or q, like Herdr.
bind-key r switch-client -T resize
bind-key -T resize h resize-pane -L 2 \; switch-client -T resize
bind-key -T resize j resize-pane -D 2 \; switch-client -T resize
bind-key -T resize k resize-pane -U 2 \; switch-client -T resize
bind-key -T resize l resize-pane -R 2 \; switch-client -T resize
bind-key -T resize Left resize-pane -L 2 \; switch-client -T resize
bind-key -T resize Down resize-pane -D 2 \; switch-client -T resize
bind-key -T resize Up resize-pane -U 2 \; switch-client -T resize
bind-key -T resize Right resize-pane -R 2 \; switch-client -T resize
bind-key -T resize Escape switch-client -T root
bind-key -T resize q switch-client -T root

# Use vim keybindings in copy mode
setw -g mode-keys vi
bind-key e \
  run-shell "tmux set-buffer -b edit-scrollback-cursor 'call cursor(#{?#{==:#{pane_mode},copy-mode},#{e|+:#{e|-:#{e|+:#{history_size},#{copy_cursor_y}},#{scroll_position}},1},#{e|+:#{e|+:#{history_size},#{cursor_y}},1}}, #{?#{==:#{pane_mode},copy-mode},#{e|+:#{copy_cursor_x},1},#{e|+:#{cursor_x},1}})'" \; \
  capture-pane -S - -b edit-scrollback \; \
  display-popup -E -w 90% -h 90% "tmux show-buffer -b edit-scrollback | nvim -c \"$(tmux show-buffer -b edit-scrollback-cursor)\" -; tmux delete-buffer -b edit-scrollback; tmux delete-buffer -b edit-scrollback-cursor"

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
if-shell "uname | grep -q Darwin" 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"'
if-shell "uname | grep -q Linux" 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'

# # Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
if-shell "uname | grep -q Darwin" 'bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"'
if-shell "uname | grep -q Linux" 'bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'

# reattach on OS X
if-shell "uname | grep -q Darwin" 'set -g default-command "reattach-to-user-namespace -l zsh"'

# bindkey for copy mode
bind-key -T copy-mode Escape send-keys -X clear-selection
bind-key -T copy-mode C-c send-keys -X cancel
bind-key -T copy-mode C-v send-keys -X rectangle-toggle
bind-key -T copy-mode V send-keys -X select-line
bind-key -T copy-mode-vi _ send-keys -X start-of-line
bind-key -T copy-mode-vi C-a send-keys -X start-of-line
bind-key -T copy-mode-vi 1 send-keys -X start-of-line
bind-key -T copy-mode-vi C-e send-keys -X end-of-line
bind-key -T copy-mode-vi 0 send-keys -X end-of-line
bind-key -T copy-mode w send-keys -X next-word
bind-key -T copy-mode e send-keys -X next-word-end
bind-key -T copy-mode b send-keys -X previous-word
bind-key -T copy-mode H send-keys -X top-line
bind-key -T copy-mode L send-keys -X bottom-line
bind-key -T copy-mode / send-keys -X search-forward
bind-key -T copy-mode ? send-keys -X search-backward
bind-key -T copy-mode C-b send-keys -X page-up
bind-key -T copy-mode C-f send-keys -X page-down
bind-key -T copy-mode C-u send-keys -X scroll-up
bind-key -T copy-mode C-d send-keys -X scroll-down

bind-key -n M-C-h resize-pane -L -t 1
bind-key -n M-C-l resize-pane -R -t 1
bind-key -n M-C-k resize-pane -U -t 1
bind-key -n M-C-j resize-pane -D -t 1

# scroll with mouse
